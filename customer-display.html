<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شاشة الزبائن - FoodExpress</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="auth.js"></script>
<script src="api.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0c0f1a;
  --surface:#161b2e;
  --surface2:#1e2745;
  --surface3:#2a3558;
  --text:#f1f5f9;
  --text2:#94a3b8;
  --text3:#64748b;
  --primary:#d35400;
  --primary-hover:#e67e22;
  --preparing:#f59e0b;
  --preparing-bg:rgba(245,158,11,.1);
  --ready:#10b981;
  --ready-bg:rgba(16,185,129,.1);
  --border:#1e293b;
  --radius:14px;
  --radius-sm:10px;
  --shadow:0 4px 24px rgba(0,0,0,.4)
}
html,body{height:100%;font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
svg{display:inline-block;vertical-align:middle;flex-shrink:0}
.header{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  flex-shrink:0
}
.header-right{display:flex;align-items:center;gap:12px}
.header-brand{display:flex;align-items:center;gap:10px}
.header-brand-icon{width:32px;height:32px;color:var(--primary)}
.header-brand-name{font-size:1.3rem;font-weight:900;color:var(--text);line-height:1.1}
.header-brand-sub{font-size:.78rem;color:var(--text3);font-weight:600}
.header-center{text-align:center}
.header-center .screen-label{font-size:.95rem;font-weight:700;color:var(--text2);letter-spacing:.5px}
.header-center .screen-label svg{margin-left:6px;color:var(--primary)}
.header-left{text-align:left;direction:ltr}
.clock{font-size:1.8rem;font-weight:800;color:var(--text);line-height:1.1;font-feature-settings:'tnum'}
.update-info{font-size:.8rem;color:var(--text3);margin-top:2px}
.main{
  height:calc(100vh - 72px);
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0;
  overflow:hidden
}
.column{display:flex;flex-direction:column;overflow:hidden}
.column:first-child{border-left:1px solid var(--border)}
.column-header{
  padding:18px 20px 12px;
  text-align:center;
  border-bottom:2px solid var(--border);
  flex-shrink:0;
  background:var(--surface)
}
.column-header h2{font-size:1.3rem;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px}
.column-header .count{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:.9rem;
  font-weight:700;
  min-width:28px;height:28px;
  padding:0 10px;
  border-radius:999px;
  margin-top:6px;
  background:var(--surface2);
  color:var(--text2)
}
.col-preparing .column-header{border-bottom-color:var(--preparing)}
.col-preparing .column-header h2{color:var(--preparing)}
.col-ready .column-header{border-bottom-color:var(--ready)}
.col-ready .column-header h2{color:var(--ready)}
.cards{
  flex:1;
  overflow-y:auto;
  padding:16px 14px;
  display:flex;
  flex-direction:column;
  gap:12px
}
.cards::-webkit-scrollbar{width:5px}
.cards::-webkit-scrollbar-track{background:transparent}
.cards::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:6px}
.card{
  background:var(--surface);
  border-radius:var(--radius);
  padding:20px 24px;
  box-shadow:var(--shadow);
  border:2px solid transparent;
  transition:box-shadow .25s
}
.card-preparing{border-color:rgba(245,158,11,.25)}
.card-ready{
  border-color:rgba(16,185,129,.5);
  background:linear-gradient(135deg,var(--surface),#064e3b)
}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.card-order-id{
  font-size:2.2rem;
  font-weight:900;
  color:var(--text);
  letter-spacing:1.5px;
  line-height:1.1
}
.card-type{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:.85rem;
  font-weight:700;
  padding:5px 14px;
  border-radius:999px;
  white-space:nowrap
}
.card-type svg{width:14px;height:14px}
.type-delivery{background:rgba(245,158,11,.12);color:#f59e0b}
.type-pickup{background:rgba(6,182,212,.12);color:#06b6d4}
.type-dinein{background:rgba(249,115,22,.12);color:#f97316}
.card-body{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-table{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:1.1rem;
  font-weight:800;
  color:#f97316;
  background:rgba(249,115,22,.12);
  padding:5px 14px;
  border-radius:10px
}
.card-table svg{width:16px;height:16px}
.card-status-badge{
  font-size:.95rem;
  font-weight:700;
  padding:5px 16px;
  border-radius:999px;
  display:inline-flex;
  align-items:center;
  gap:6px
}
.card-status-badge svg{width:14px;height:14px}
.badge-preparing{background:rgba(245,158,11,.12);color:var(--preparing)}
.badge-ready{background:rgba(16,185,129,.12);color:var(--ready)}
.empty-col{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:48px 20px;
  color:var(--text3);
  font-size:1rem;
  text-align:center;
  gap:12px
}
.empty-col svg{width:36px;height:36px;opacity:.3}
.empty-col .empty-text{font-weight:600}
.access-denied{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
  gap:16px;
  text-align:center;
  padding:24px
}
.access-denied svg{width:48px;height:48px;color:#ef4444}
.access-denied h1{font-size:1.8rem;font-weight:800;color:#ef4444;display:flex;align-items:center;gap:10px}
.access-denied p{color:var(--text2);font-size:1rem;line-height:1.6}
.access-denied a{color:var(--primary);text-decoration:none;font-weight:700;margin-top:8px;display:inline-flex;align-items:center;gap:6px}
.access-denied a:hover{text-decoration:underline}
@keyframes ready-glow{
  0%{box-shadow:0 0 0 0 rgba(16,185,129,.7);border-color:var(--ready)}
  50%{box-shadow:0 0 30px 8px rgba(16,185,129,.3)}
  100%{box-shadow:0 0 0 0 rgba(16,185,129,0);border-color:rgba(16,185,129,.5)}
}
.card.highlight-new{animation:ready-glow 4s ease-out forwards}
@media(max-width:900px){
  .main{grid-template-columns:1fr}
  .column:first-child{border-left:none}
  .header{height:auto;padding:10px 16px;flex-wrap:wrap;gap:6px}
  .header-brand-name{font-size:1.1rem}
  .clock{font-size:1.3rem}
  .card-order-id{font-size:1.6rem}
}
</style>
</head>
<body>

<div id="app-root" style="display:none;height:100%;flex-direction:column">
  <header class="header">
    <div class="header-right">
      <div class="header-brand">
        <svg class="header-brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c6 0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
        <div>
          <div class="header-brand-name" id="store-name">FoodExpress</div>
          <div class="header-brand-sub">شاشة متابعة الطلبات</div>
        </div>
      </div>
    </div>
    <div class="header-center">
      <div class="screen-label"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg> حالة الطلبات</div>
    </div>
    <div class="header-left">
      <div class="clock" id="clock">--:--:--</div>
      <div class="update-info">آخر تحديث: <span id="last-update">-</span></div>
    </div>
  </header>

  <div class="main" id="main">
    <div class="column col-preparing">
      <div class="column-header">
        <h2><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> قيد التحضير</h2>
        <span class="count" id="count-preparing">0</span>
      </div>
      <div class="cards" id="cards-preparing"></div>
    </div>
    <div class="column col-ready">
      <div class="column-header">
        <h2><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> جاهز</h2>
        <span class="count" id="count-ready">0</span>
      </div>
      <div class="cards" id="cards-ready"></div>
    </div>
  </div>
</div>

<div id="access-denied" class="access-denied" style="display:none">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
  <h1>وصول مرفوض</h1>
  <p>ليس لديك صلاحية الوصول إلى شاشة الزبائن.<br>تأكد من تسجيل الدخول بحساب مناسب.</p>
  <a href="/login.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> تسجيل الدخول</a>
</div>

<script>
(function(){
  const ALLOWED_ROLES = ['super_admin','store_owner','store_manager','manager','employee'];
  const CUSTOMER_STATUSES = ['confirmed','processing','shipped'];

  const ORDER_TYPE_LABELS = {
    delivery: { icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-1"/><polygon points="6 17 9 13 12 17 15 10 18 17"/></svg>', label: 'توصيل', cls: 'type-delivery' },
    pickup: { icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>', label: 'استلام', cls: 'type-pickup' },
    dinein: { icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c6 0 1.1.9 2 2 2h3Zm0 0v7"/></svg>', label: 'داخلي', cls: 'type-dinein' }
  };

  let ordersData = [];
  let refreshTimer = null;
  let isRefreshing = false;
  let clockTimer = null;
  let seenReadyIds = new Set();

  function $(id) { return document.getElementById(id); }

  function updateClock() {
    const now = new Date();
    const time = now.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const el = $('clock');
    if (el) el.textContent = time;
  }

  function getOrderTypeHtml(type) {
    const t = ORDER_TYPE_LABELS[type] || ORDER_TYPE_LABELS.delivery;
    return `<span class="card-type ${t.cls}">${t.icon} ${t.label}</span>`;
  }

  function buildCard(order) {
    const status = order.status;
    const isReady = status === 'shipped';
    const cardCls = isReady ? 'card card-ready' : 'card card-preparing';
    const badgeCls = isReady ? 'badge-ready' : 'badge-preparing';
    const badgeSvg = isReady
      ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
      : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
    const badgeLabel = isReady ? 'جاهز' : 'قيد التحضير';
    const tableHtml = order.tableNumber
      ? `<div class="card-table"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c6 0 1.1.9 2 2 2h3Zm0 0v7"/></svg> طاولة ${order.tableNumber}</div>`
      : '';

    return `
      <div class="${cardCls}" data-order-id="${order.id}">
        <div class="card-header">
          <span class="card-order-id">#${order.orderNumber || order.id}</span>
          ${getOrderTypeHtml(order.orderType)}
        </div>
        <div class="card-body">
          ${tableHtml}
          <span class="card-status-badge ${badgeCls}">${badgeSvg} ${badgeLabel}</span>
        </div>
      </div>
    `;
  }

  function renderColumns() {
    const grouped = { preparing: [], ready: [] };
    ordersData.forEach(o => {
      if (o.status === 'confirmed' || o.status === 'processing') {
        grouped.preparing.push(o);
      } else if (o.status === 'shipped') {
        grouped.ready.push(o);
      }
    });

    const sections = [
      { id: 'preparing', list: grouped.preparing },
      { id: 'ready', list: grouped.ready }
    ];

    sections.forEach(s => {
      const container = $('cards-' + s.id);
      const countEl = $('count-' + s.id);
      if (countEl) countEl.textContent = s.list.length;
      if (container) {
        if (s.list.length === 0) {
          container.innerHTML = `<div class="empty-col"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg><span class="empty-text">لا توجد طلبات ${s.id === 'preparing' ? 'قيد التحضير' : 'جاهزة الآن'}</span></div>`;
        } else {
          container.innerHTML = s.list.map(o => buildCard(o)).join('');
        }
      }
    });

    $('last-update').textContent = new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  function highlightNewReady() {
    const currentReadyIds = new Set(
      ordersData.filter(o => o.status === 'shipped').map(o => String(o.id))
    );
    if (seenReadyIds.size > 0) {
      const newIds = [...currentReadyIds].filter(id => !seenReadyIds.has(id));
      newIds.forEach(id => {
        const card = Array.from(document.querySelectorAll('.card')).find(c => c.dataset.orderId === id);
        if (card) card.classList.add('highlight-new');
      });
    }
    seenReadyIds = currentReadyIds;
  }

  async function fetchAndRender() {
    if (isRefreshing) return;
    isRefreshing = true;
    try {
      const token = sessionStorage.getItem('louloToken');
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers['Authorization'] = 'Bearer ' + token;

      const resp = await fetch('/api/orders', { headers });
      if (resp.status === 401) {
        if (typeof Auth !== 'undefined' && Auth.logout) Auth.logout();
        window.location.href = '/login.html?expired=1';
        return;
      }
      if (!resp.ok) return;

      const data = await resp.json();
      ordersData = Array.isArray(data) ? data : (data && data.data ? data.data : []);
      renderColumns();
      highlightNewReady();
    } catch (e) {
      console.error('[CustomerDisplay] Refresh error:', e);
    } finally {
      isRefreshing = false;
    }
  }

  function init() {
    const root = $('app-root');
    const denied = $('access-denied');

    try {
      if (typeof Auth === 'undefined' || !Auth.getSession) {
        if (root) root.style.display = 'none';
        if (denied) {
          denied.style.display = 'flex';
          denied.querySelector('p').textContent = 'لم يتم تحميل نظام المصادقة. تأكد من تحميل auth.js.';
        }
        return;
      }

      const session = Auth.getSession();
      if (!session) {
        window.location.href = '/login.html?redirect=' + encodeURIComponent(window.location.pathname);
        return;
      }

      if (!ALLOWED_ROLES.includes(session.role)) {
        if (root) root.style.display = 'none';
        if (denied) {
          denied.style.display = 'flex';
          denied.querySelector('p').innerHTML = 'دورك الحالي: <strong>' + (Auth.getRoleLabel ? Auth.getRoleLabel(session.role) : session.role) + '</strong><br>شاشة الزبائن غير متاحة لهذا الدور.';
        }
        return;
      }

      try {
        const settingsStr = sessionStorage.getItem('louloSettings');
        if (settingsStr) {
          const settings = JSON.parse(settingsStr);
          if (settings.storeName) {
            const nameEl = $('store-name');
            if (nameEl) nameEl.textContent = settings.storeName;
          }
        }
      } catch (_) {}

      if (root) root.style.display = 'flex';
      if (denied) denied.style.display = 'none';

      updateClock();
      if (clockTimer) clearInterval(clockTimer);
      clockTimer = setInterval(updateClock, 1000);

      fetchAndRender();

      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = setInterval(fetchAndRender, 15000);
    } catch (e) {
      console.error('[CustomerDisplay] Init error:', e);
      if (root) root.style.display = 'none';
      if (denied) {
        denied.style.display = 'flex';
        denied.querySelector('p').textContent = 'حدث خطأ أثناء تهيئة شاشة الزبائن.';
      }
    }
  }

  document.addEventListener('DOMContentLoaded', init);
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(init, 100);
  }
})();
</script>
</body>
</html>
