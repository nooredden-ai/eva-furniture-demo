<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة الطاولات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="auth.js"></script>

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0c0f1a;
  --surface:#161b2e;
  --surface2:#1e2745;
  --surface3:#2a3558;
  --text:#edf2f7;
  --text2:#94a3b8;
  --text3:#64748b;
  --primary:#d35400;
  --primary-hover:#e67e22;
  --primary-light:rgba(211,84,0,.15);
  --available:#22c55e;
  --available-bg:rgba(34,197,94,.12);
  --occupied:#f59e0b;
  --occupied-bg:rgba(245,158,11,.12);
  --ready:#0ea5e9;
  --ready-bg:rgba(14,165,233,.12);
  --inactive:#64748b;
  --inactive-bg:rgba(100,116,139,.1);
  --danger:#ef4444;
  --danger-bg:rgba(239,68,68,.12);
  --border:#1e293b;
  --radius:14px;
  --radius-sm:10px;
  --shadow:0 4px 20px rgba(0,0,0,.3);
  --header-h:68px
}
html,body{height:100%;font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);font-size:14px;overflow:hidden}
button{cursor:pointer;font-family:inherit;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
svg{display:inline-block;vertical-align:middle;flex-shrink:0}
/* Header */
.header{
  height:var(--header-h);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  flex-shrink:0
}
.header-right{display:flex;align-items:center;gap:14px}
.header-logo{display:flex;align-items:center;gap:10px}
.header-logo svg{color:var(--primary)}
.header-title{font-size:1.15rem;font-weight:800;color:var(--text)}
.header-title span{color:var(--primary)}
.header-sub{font-size:.82rem;color:var(--text2);margin-top:-2px}
.header-left{display:flex;align-items:center;gap:10px}
.btn-back{
  display:flex;align-items:center;gap:6px;
  padding:7px 16px;border-radius:var(--radius-sm);
  font-size:.82rem;font-weight:600;
  background:var(--surface2);color:var(--text2);
  transition:all .15s
}
.btn-back:hover{background:var(--surface3);color:var(--text)}
/* Main wrap */
.tables-wrap{
  padding:20px 24px;
  height:calc(100vh - var(--header-h));
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:16px
}
.tables-wrap::-webkit-scrollbar{width:6px}
.tables-wrap::-webkit-scrollbar-track{background:transparent}
.tables-wrap::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:3px}
/* Stats bar */
.stats-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap
}
.stats-group{
  display:flex;
  gap:10px;
  flex-wrap:wrap
}
.stat-item{
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px 16px;
  border-radius:var(--radius-sm);
  background:var(--surface);
  border:1px solid var(--border);
  font-size:.82rem;
  font-weight:600;
  color:var(--text2)
}
.stat-item svg{width:18px;height:18px}
.stat-item .stat-num{font-size:1.1rem;font-weight:800;color:var(--text);margin-left:2px}
.stat-item.stat-available{border-color:var(--available);color:var(--available)}
.stat-item.stat-occupied{border-color:var(--occupied);color:var(--occupied)}
.stat-item.stat-ready{border-color:var(--ready);color:var(--ready)}
.stat-item.stat-total svg{color:var(--primary)}
.actions-group{display:flex;gap:8px}
.btn-primary-action{
  display:flex;align-items:center;gap:7px;
  padding:9px 20px;border-radius:var(--radius-sm);
  font-size:.85rem;font-weight:700;
  background:var(--primary);color:#fff;
  transition:all .15s;white-space:nowrap
}
.btn-primary-action:hover{background:var(--primary-hover)}
.btn-secondary-action{
  display:flex;align-items:center;gap:7px;
  padding:9px 16px;border-radius:var(--radius-sm);
  font-size:.82rem;font-weight:600;
  background:var(--surface2);color:var(--text2);
  transition:all .15s;white-space:nowrap
}
.btn-secondary-action:hover{background:var(--surface3);color:var(--text)}
/* Grid */
.tables-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:16px;
  flex:1
}
/* Card */
.table-card{
  background:var(--surface);
  border-radius:var(--radius);
  padding:20px;
  border:1px solid var(--border);
  transition:all .2s;
  display:flex;
  flex-direction:column;
  gap:12px;
  box-shadow:var(--shadow)
}
.table-card:hover{border-color:var(--surface3);box-shadow:0 6px 28px rgba(0,0,0,.4)}
.table-card.disabled{opacity:.45}
.table-card.disabled:hover{border-color:var(--border);box-shadow:var(--shadow)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card-title-group{display:flex;flex-direction:column;gap:2px}
.card-table-code{font-size:1.6rem;font-weight:900;color:var(--text);line-height:1.1}
.card-table-code .code-hash{color:var(--primary);margin-left:2px}
.card-table-name{font-size:.88rem;color:var(--text2)}
.card-capacity{
  display:flex;align-items:center;gap:5px;
  font-size:.8rem;color:var(--text3);margin-top:2px
}
.card-capacity svg{width:15px;height:15px;color:var(--text3)}
/* Status badge */
.status-badge{
  display:flex;
  align-items:center;
  gap:5px;
  padding:5px 14px;
  border-radius:20px;
  font-size:.78rem;
  font-weight:700;
  white-space:nowrap
}
.status-badge svg{width:15px;height:15px}
.status-badge.available{background:var(--available-bg);color:var(--available)}
.status-badge.occupied{background:var(--occupied-bg);color:var(--occupied)}
.status-badge.ready{background:var(--ready-bg);color:var(--ready)}
.status-badge.inactive{background:var(--inactive-bg);color:var(--inactive)}
/* Order info box */
.order-box{
  background:var(--surface2);
  border-radius:var(--radius-sm);
  padding:12px 14px;
  display:flex;
  flex-direction:column;
  gap:7px;
  border-right:3px solid var(--occupied)
}
.order-box.status-ready{border-right-color:var(--ready)}
.order-box.status-occupied{border-right-color:var(--occupied)}
.order-row{display:flex;justify-content:space-between;align-items:center;font-size:.82rem}
.order-label{color:var(--text2);display:flex;align-items:center;gap:5px}
.order-label svg{width:15px;height:15px;color:var(--text3)}
.order-value{font-weight:700;color:var(--text)}
.order-status-dot{
  display:inline-flex;align-items:center;gap:4px
}
.order-status-dot .dot{
  width:8px;height:8px;border-radius:50%;display:inline-block
}
.dot-pending{background:#a855f7}
.dot-confirmed{background:#22c55e}
.dot-processing{background:#f59e0b}
.dot-shipped{background:#0ea5e9}
/* Actions */
.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.card-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 14px;
  border-radius:var(--radius-sm);
  font-size:.8rem;
  font-weight:700;
  transition:all .15s;
  text-align:center;
  min-height:42px
}
.card-btn svg{width:18px;height:18px}
.card-btn.pos{
  flex:2;
  background:var(--primary);
  color:#fff;
  min-width:100px
}
.card-btn.pos:hover{background:var(--primary-hover)}
.card-btn.qr{
  flex:1;
  background:var(--surface2);
  color:var(--text2);
  min-width:60px
}
.card-btn.qr:hover{background:var(--surface3);color:var(--text)}
.card-btn.link{
  flex:1;
  background:var(--surface2);
  color:var(--text2);
  min-width:60px
}
.card-btn.link:hover{background:var(--surface3);color:var(--text)}
.card-btn.admin-edit{
  background:var(--surface2);
  color:var(--text2);
  padding:10px 12px;
  min-width:42px;
  flex:0
}
.card-btn.admin-edit:hover{background:var(--surface3);color:var(--text)}
.card-btn.admin-toggle{
  min-width:42px;
  flex:0;
  padding:10px 12px
}
.card-btn.admin-toggle.on{background:var(--danger-bg);color:var(--danger)}
.card-btn.admin-toggle.on:hover{background:rgba(239,68,68,.25)}
.card-btn.admin-toggle.off{background:var(--available-bg);color:var(--available)}
.card-btn.admin-toggle.off:hover{background:rgba(34,197,94,.25)}
.admin-actions{display:flex;gap:6px}
/* Empty state */
.empty-state{
  grid-column:1/-1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  min-height:300px;
  color:var(--text3);
  text-align:center
}
.empty-state svg{width:48px;height:48px;color:var(--surface3)}
.empty-state p{font-size:.95rem}
/* Access denied */
.access-denied{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
  gap:16px;
  text-align:center;
  padding:24px
}
.access-denied svg{width:48px;height:48px;color:var(--danger)}
.access-denied h1{font-size:1.8rem;color:var(--danger)}
.access-denied p{color:var(--text2);font-size:.95rem;max-width:400px;line-height:1.6}
.access-denied a{color:var(--primary);text-decoration:none;font-weight:700;margin-top:8px}
.access-denied a:hover{color:var(--primary-hover)}
/* Modal */
.modal-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:999;
  align-items:center;
  justify-content:center;
  padding:20px;
  backdrop-filter:blur(4px)
}
.modal-overlay.show{display:flex}
.modal-box{
  background:var(--surface);
  border-radius:var(--radius);
  width:100%;
  max-width:420px;
  padding:28px;
  box-shadow:0 12px 50px rgba(0,0,0,.6);
  border:1px solid var(--border)
}
.modal-box h3{
  font-size:1.1rem;font-weight:800;margin-bottom:6px;
  display:flex;align-items:center;gap:8px
}
.modal-box h3 svg{color:var(--primary);width:22px;height:22px}
.modal-desc{font-size:.82rem;color:var(--text3);margin-bottom:18px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:.82rem;font-weight:700;margin-bottom:5px;color:var(--text2)}
.form-group input,.form-group select{
  width:100%;
  padding:12px 14px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border);
  background:var(--surface2);
  color:var(--text);
  font-size:.9rem;
  transition:border-color .15s
}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--primary)}
.form-group input::placeholder{color:var(--text3)}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.btn-save{
  flex:1;
  display:flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 14px;
  border-radius:var(--radius-sm);
  font-size:.88rem;
  font-weight:700;
  background:var(--primary);
  color:#fff;
  text-align:center;
  transition:all .15s
}
.btn-save:hover{background:var(--primary-hover)}
.btn-save:disabled{opacity:.5;cursor:not-allowed}
.btn-cancel{
  padding:12px 20px;
  border-radius:var(--radius-sm);
  font-size:.82rem;
  font-weight:600;
  background:var(--surface2);
  color:var(--text2);
  text-align:center;
  transition:all .15s
}
.btn-cancel:hover{background:var(--surface3);color:var(--text)}
/* Toast */
.toast{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  background:var(--surface);
  color:var(--text);
  padding:14px 28px;
  border-radius:var(--radius-sm);
  font-weight:700;
  font-size:.88rem;
  box-shadow:0 6px 30px rgba(0,0,0,.5);
  z-index:1000;
  display:none;
  border:1px solid var(--border);
  white-space:nowrap
}
.toast.show{display:block}
.toast.success{border-color:var(--available);color:var(--available)}
.toast.error{border-color:var(--danger);color:var(--danger)}
/* Responsive */
@media(max-width:900px){
  .tables-grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  .stats-bar{flex-direction:column;align-items:stretch}
  .stats-group{justify-content:center}
  .actions-group{justify-content:center}
}
@media(max-width:600px){
  .tables-wrap{padding:14px}
  .tables-grid{grid-template-columns:1fr}
  .header{padding:0 14px}
  .header-title{font-size:1rem}
  .stat-item{padding:6px 12px;font-size:.78rem}
  .card-table-code{font-size:1.3rem}
  .card-btn{font-size:.75rem;padding:8px 10px;min-height:38px}
  .card-btn.pos{min-width:80px}
  .modal-box{padding:20px}
}
@media(max-width:400px){
  .card-actions{flex-direction:column}
  .card-btn.pos{flex:1}
}
</style>
</head>
<body>
<div id="app-root" style="display:none;height:100%;flex-direction:column">
  <header class="header">
    <div class="header-right">
      <div class="header-logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 3v18"/></svg>
        <div>
          <div class="header-title">إدارة <span>الطاولات</span></div>
          <div class="header-sub" id="store-name"></div>
        </div>
      </div>
    </div>
    <div class="header-left">
      <button class="btn-back" onclick="window.location.href='/admin.html'">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        العودة
      </button>
    </div>
  </header>
  <div class="tables-wrap">
    <div class="stats-bar">
      <div class="stats-group" id="stats-group">
        <div class="stat-item stat-total">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 3v18"/></svg>
          <span>الإجمالي</span>
          <span class="stat-num" id="stat-total">0</span>
        </div>
        <div class="stat-item stat-available">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          <span>متاحة</span>
          <span class="stat-num" id="stat-available">0</span>
        </div>
        <div class="stat-item stat-occupied">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>مشغولة</span>
          <span class="stat-num" id="stat-occupied">0</span>
        </div>
        <div class="stat-item stat-ready">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          <span>جاهزة</span>
          <span class="stat-num" id="stat-ready">0</span>
        </div>
      </div>
      <div class="actions-group">
        <button class="btn-secondary-action" onclick="refresh()" title="تحديث">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          تحديث
        </button>
        <button class="btn-primary-action" id="btn-add-table" onclick="showAddModal()" style="display:none">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          إضافة طاولة
        </button>
      </div>
    </div>
    <div class="tables-grid" id="tables-grid"></div>
  </div>
</div>
<div id="access-denied" class="access-denied" style="display:none">
  <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
  <h1>وصول مرفوض</h1>
  <p id="denied-msg">ليس لديك صلاحية الوصول إلى إدارة الطاولات.<br>تأكد من تسجيل الدخول بحساب مناسب.</p>
  <a href="/login.html">تسجيل الدخول</a>
</div>
<div class="modal-overlay" id="table-modal">
  <div class="modal-box">
    <h3>
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 3v18"/></svg>
      <span id="modal-title">إضافة طاولة</span>
    </h3>
    <p class="modal-desc" id="modal-desc">أدخل بيانات الطاولة الجديدة</p>
    <div class="form-group">
      <label>رمز الطاولة (مثال: T01)</label>
      <input type="text" id="f-code" placeholder="T01" maxlength="10">
    </div>
    <div class="form-group">
      <label>اسم الطاولة</label>
      <input type="text" id="f-name" placeholder="طاولة 1">
    </div>
    <div class="form-group">
      <label>السعة (عدد الأشخاص)</label>
      <input type="number" id="f-capacity" placeholder="4" min="1" max="50">
    </div>
    <div class="modal-actions">
      <button class="btn-save" id="modal-save" onclick="saveTable()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        حفظ
      </button>
      <button class="btn-cancel" onclick="closeModal()">إلغاء</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
  const ALLOWED_ROLES = ['super_admin','store_owner','store_manager','manager','employee'];
  let tables = [];
  let orders = [];
  let editingId = null;
  let canManage = false;

  function $(id){return document.getElementById(id)}

  function showToast(msg, type){
    const el=$('toast');
    el.textContent=msg;
    el.className='toast show'+(type?' '+type:'');
    clearTimeout(el._t);
    el._t=setTimeout(function(){el.className='toast'},3000);
  }

  async function fetchTables(){
    try{
      const token=sessionStorage.getItem('louloToken');
      const h={'Content-Type':'application/json'};
      if(token) h['Authorization']='Bearer '+token;
      const r=await fetch('/api/tables',{headers:h});
      if(!r.ok) return;
      const d=await r.json();
      tables=Array.isArray(d)?d:(d&&d.data?d.data:[]);
    }catch(e){console.error('[Tables] fetch error:',e)}
  }

  async function fetchOrders(){
    try{
      const token=sessionStorage.getItem('louloToken');
      const h={'Content-Type':'application/json'};
      if(token) h['Authorization']='Bearer '+token;
      const r=await fetch('/api/orders',{headers:h});
      if(!r.ok) return;
      const d=await r.json();
      orders=Array.isArray(d)?d:(d&&d.data?d.data:[]);
    }catch(e){console.error('[Tables] orders fetch error:',e)}
  }

  function getTableStatus(tableCode){
    if(!tableCode) return 'inactive';
    const activeOrders=orders.filter(function(o){
      if(!o.tableNumber) return false;
      if(String(o.tableNumber)!==String(tableCode)) return false;
      return ['pending','confirmed','processing','shipped'].includes(o.status);
    });
    if(activeOrders.length===0) return 'available';
    const hasShipped=activeOrders.some(function(o){return o.status==='shipped'});
    if(hasShipped) return 'ready';
    return 'occupied';
  }

  function getActiveOrder(tableCode){
    if(!tableCode) return null;
    return orders.find(function(o){
      return String(o.tableNumber)===String(tableCode)&&['pending','confirmed','processing','shipped'].includes(o.status);
    })||null;
  }

  function statusLabel(s){
    var m={available:'متاحة',occupied:'مشغولة',ready:'جاهزة',inactive:'غير مفعّلة'};
    return m[s]||s;
  }

  function orderStatusLabel(s){
    var m={pending:'قيد الانتظار',confirmed:'مؤكد',processing:'بالتحضير',shipped:'جاهز'};
    return m[s]||s;
  }

  function orderStatusDot(s){
    var m={pending:'dot-pending',confirmed:'dot-confirmed',processing:'dot-processing',shipped:'dot-shipped'};
    return m[s]||'dot-pending';
  }

  function render(){
    const el=$('tables-grid');
    if(!el) return;
    const total=tables.length;
    const available=tables.filter(function(t){return t.active!==false&&getTableStatus(t.code)==='available'}).length;
    const occupied=tables.filter(function(t){return t.active!==false&&getTableStatus(t.code)==='occupied'}).length;
    const ready=tables.filter(function(t){return t.active!==false&&getTableStatus(t.code)==='ready'}).length;
    $('stat-total').textContent=total;
    $('stat-available').textContent=available;
    $('stat-occupied').textContent=occupied;
    $('stat-ready').textContent=ready;
    if(total===0){
      el.innerHTML='<div class="empty-state">'+
        '<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 3v18"/></svg>'+
        '<p>لا توجد طاولات بعد.<br>أضف أول طاولة الآن.</p></div>';
      return;
    }
    var sorted = tables.slice().sort(function(a,b){return (a.code||'').localeCompare(b.code||'',undefined,{numeric:true})});
    el.innerHTML=sorted.map(function(t){
      var status=t.active!==false?getTableStatus(t.code):'inactive';
      var cardCls='table-card'+(t.active===false?' disabled':'');
      var order=getActiveOrder(t.code);
      var orderHtml='';
      if(order){
        var stLabel=orderStatusLabel(order.status);
        var dotCls=orderStatusDot(order.status);
        var time=order.lastUpdated?new Date(order.lastUpdated).toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'}):'';
        var orderBoxCls='order-box';
        if(status==='ready') orderBoxCls+=' status-ready';
        else if(status==='occupied') orderBoxCls+=' status-occupied';
        orderHtml='<div class="'+orderBoxCls+'">'+
          '<div class="order-row"><span class="order-label">'+
          '<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>'+
          'الطلب</span><span class="order-value">#'+(order.orderNumber||order.id)+'</span></div>'+
          '<div class="order-row"><span class="order-label">'+
          '<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'+
          'الحالة</span><span class="order-status-dot"><span class="dot '+dotCls+'"></span>'+stLabel+'</span></div>'+
          (time?'<div class="order-row"><span class="order-label">'+
          '<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>'+
          'آخر تحديث</span><span class="order-value">'+time+'</span></div>':'')+
          '</div>';
      }
      var adminBtns = canManage ? '<div class="admin-actions">'+
        '<button class="card-btn admin-edit" onclick="editTable(\''+t.id+'\')" title="تعديل">'+
        '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>'+
        '</button>'+
        '<button class="card-btn admin-toggle '+(t.active!==false?'on':'off')+'" onclick="toggleTable(\''+t.id+'\')" title="'+(t.active!==false?'تعطيل':'تفعيل')+'">'+
        '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="5" width="22" height="14" rx="7" ry="7"/><circle cx="16" cy="12" r="3"/></svg>'+
        '</button></div>' : '';
      return '<div class="'+cardCls+'">'+
        '<div class="card-top">'+
          '<div class="card-title-group">'+
            '<div class="card-table-code"><span class="code-hash">#</span>'+t.code+'</div>'+
            '<div class="card-table-name">'+t.name+'</div>'+
            '<div class="card-capacity">'+
              '<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>'+
              t.capacity+' أشخاص'+
            '</div>'+
          '</div>'+
          '<span class="status-badge '+status+'">'+
            (status==='available'?'<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>':'')+
            (status==='occupied'?'<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>':'')+
            (status==='ready'?'<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>':'')+
            (status==='inactive'?'<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>':'')+
            statusLabel(status)+
          '</span>'+
        '</div>'+
        orderHtml+
        '<div class="card-actions">'+
          '<button class="card-btn pos" onclick="openPOS(\''+t.code+'\')">'+
            '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>'+
            'فتح POS'+
          '</button>'+
          '<button class="card-btn qr" onclick="copyQR(\''+t.code+'\')" title="نسخ QR">'+
            '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>'+
            'QR'+
          '</button>'+
          '<button class="card-btn link" onclick="openQR(\''+t.code+'\')" title="فتح الرابط">'+
            '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>'+
            'رابط'+
          '</button>'+
          adminBtns+
        '</div>'+
      '</div>';
    }).join('');
  }

  async function refresh(){
    await Promise.all([fetchTables(),fetchOrders()]);
    render();
  }

  window.openPOS=function(code){
    window.open('/pos?type=dinein&table='+encodeURIComponent(code),'_blank');
  };

  window.copyQR=function(code){
    var url=window.location.origin+'/?type=dinein&table='+encodeURIComponent(code);
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){showToast('تم نسخ رابط الطاولة '+code,'success')})['catch'](function(){showToast('فشل نسخ الرابط','error')});
    }else{
      var ta=document.createElement('textarea');
      ta.value=url;
      document.body.appendChild(ta);
      ta.select();
      try{document.execCommand('copy');showToast('تم نسخ رابط الطاولة '+code,'success')}catch(e){showToast('فشل نسخ الرابط','error')}
      document.body.removeChild(ta);
    }
  };

  window.openQR=function(code){
    var url=window.location.origin+'/?type=dinein&table='+encodeURIComponent(code);
    window.open(url,'_blank');
  };

  window.showAddModal=function(){
    editingId=null;
    $('modal-title').textContent='إضافة طاولة';
    $('modal-desc').textContent='أدخل بيانات الطاولة الجديدة';
    $('f-code').value='';
    $('f-name').value='';
    $('f-capacity').value='4';
    $('table-modal').classList.add('show');
  };

  window.editTable=function(id){
    var t=tables.find(function(x){return String(x.id)===String(id)});
    if(!t) return;
    editingId=id;
    $('modal-title').textContent='تعديل الطاولة';
    $('modal-desc').textContent='تحديث بيانات الطاولة';
    $('f-code').value=t.code||'';
    $('f-name').value=t.name||'';
    $('f-capacity').value=t.capacity||'4';
    $('table-modal').classList.add('show');
  };

  window.closeModal=function(){
    $('table-modal').classList.remove('show');
    editingId=null;
  };

  window.saveTable=async function(){
    var btn=$('modal-save');
    if(btn.disabled) return;
    btn.disabled=true;
    btn.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-loader" style="animation:spin 1s linear infinite"><style>@keyframes spin{to{transform:rotate(360deg)}}</style><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg> جاري الحفظ...';
    var code=$('f-code').value.trim();
    var name=$('f-name').value.trim();
    var capacity=parseInt($('f-capacity').value)||4;
    if(!code){showToast('رمز الطاولة مطلوب','error');btn.disabled=false;btn.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> حفظ';return;}
    if(!name){name='طاولة '+code;}
    var token=sessionStorage.getItem('louloToken');
    var h={'Content-Type':'application/json'};
    if(token) h['Authorization']='Bearer '+token;
    var body={code:code,name:name,capacity:capacity};
    try{
      var r;
      if(editingId){
        r=await fetch('/api/tables/'+encodeURIComponent(editingId),{method:'PUT',headers:h,body:JSON.stringify(body)});
      }else{
        r=await fetch('/api/tables',{method:'POST',headers:h,body:JSON.stringify(body)});
      }
      var res=await r.json();
      if(r.ok){
        showToast((editingId?'تم تحديث الطاولة':'تمت إضافة الطاولة'),'success');
        closeModal();
        await refresh();
      }else{
        showToast(res.message||'فشل العملية','error');
      }
    }catch(e){
      showToast('خطأ في الاتصال بالسيرفر','error');
    }
    btn.disabled=false;
    btn.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> حفظ';
  };

  window.toggleTable=async function(id){
    var t=tables.find(function(x){return String(x.id)===String(id)});
    if(!t) return;
    var newActive=t.active!==false?false:true;
    var token=sessionStorage.getItem('louloToken');
    var h={'Content-Type':'application/json'};
    if(token) h['Authorization']='Bearer '+token;
    try{
      var r=await fetch('/api/tables/'+encodeURIComponent(id),{method:'PUT',headers:h,body:JSON.stringify({active:newActive})});
      if(r.ok){
        showToast('تم '+((newActive?'تفعيل':'تعطيل'))+' الطاولة','success');
        await refresh();
      }else{
        showToast('فشل تحديث الطاولة','error');
      }
    }catch(e){
      showToast('خطأ في الاتصال بالسيرفر','error');
    }
  };

  async function init(){
    const root=$('app-root');
    const denied=$('access-denied');
    try{
      if(typeof Auth==='undefined'||!Auth.getSession){
        if(root) root.style.display='none';
        if(denied){denied.style.display='flex';$('denied-msg').textContent='لم يتم تحميل نظام المصادقة.';}
        return;
      }
      const session=Auth.getSession();
      if(!session){
        window.location.href='/login.html?redirect='+encodeURIComponent(window.location.pathname);
        return;
      }
      if(!ALLOWED_ROLES.includes(session.role)){
        if(root) root.style.display='none';
        if(denied){denied.style.display='flex';$('denied-msg').innerHTML='دورك الحالي: <strong>'+(Auth.getRoleLabel?Auth.getRoleLabel(session.role):session.role)+'</strong><br>إدارة الطاولات غير متاحة لهذا الدور.';}
        return;
      }
      canManage = typeof Auth.can === 'function' && Auth.can('manage_categories');
      var addBtn = $('btn-add-table');
      if (addBtn) addBtn.style.display = canManage ? '' : 'none';
      try{
        const settingsStr=sessionStorage.getItem('louloSettings');
        if(settingsStr){var s=JSON.parse(settingsStr);if(s.storeName)$('store-name').textContent=s.storeName;}
      }catch(_){}
      if(root) root.style.display='flex';
      if(denied) denied.style.display='none';
      await refresh();
      setInterval(refresh,15000);
    }catch(e){
      console.error('[Tables] Init error:',e);
      if(root) root.style.display='none';
      if(denied){denied.style.display='flex';$('denied-msg').textContent='حدث خطأ أثناء التهيئة.';}
    }
  }
  document.addEventListener('DOMContentLoaded',init);
  if(document.readyState==='complete'||document.readyState==='interactive'){setTimeout(init,100);}
  window.refresh=refresh;
})();
</script>
</body>
</html>
